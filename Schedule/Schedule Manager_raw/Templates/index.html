<!DOCTYPE html>
<html>
<head>
<title>Schedule Manager</title>

<style>
body {
    font-family: Arial;
    margin: 30px;
}

input, select, textarea {
    margin: 5px;
    padding: 6px;
}

button {
    padding: 6px 12px;
    cursor: pointer;
}

.draft-row {
    border: 2px solid #4CAF50;
    padding: 10px;
    margin-bottom: 15px;
    position: relative;
}

.search-results {
    border: 1px solid #ccc;
    background: white;
    max-height: 200px;
    overflow-y: auto;
    width: 350px;
    position: relative;
    z-index: 999;
}

.suggestion {
    padding: 6px;
    border-bottom: 1px solid #eee;
    cursor: pointer;
}

.suggestion:hover {
    background: #f2f2f2;
}

.day-footer {
    display: flex;
    justify-content: center;
    margin-top: 10px;
    gap: 10px;
}

.meeting-controls {
    display: flex;
    justify-content: center;
    gap: 10px;
}

.textarea-row {
    display: none;
    gap: 10px;
    margin-top: 5px;
}

.textarea-row.visible {
    display: flex;
}

.textarea-row textarea {
    flex: 1;
    height: 80px;
}

.participant-set:first-child {
    border-top: none !important;
    padding-top: 0 !important;
    margin-top: 0 !important;
}

.participant-set input,
.participant-set textarea.contact {
    box-sizing: border-box;
    width: 220px;
    height: 31px;
    padding: 6px;
    margin: 5px;
    font-family: Arial;
    font-size: 13.3px;
    vertical-align: top;
    resize: vertical;
}

.topbar {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

#scheduleList {
    min-width: 220px;
}

#managementTable,
#managementTable th,
#managementTable td,
#cmsTable,
#cmsTable th,
#cmsTable td {
    border: none !important;
}
</style>
</head>

<body>

<h2>Schedule Manager</h2>

<div class="topbar">

    <button onclick="newSchedule()">New Schedule</button>

    <input id="scheduleName" placeholder="Schedule Name">

    <button onclick="saveSchedule()">💾 Save</button>

    <select id="scheduleList" onchange="loadScheduleFromSelect()"></select>

    <button onclick="deleteSchedule()">🗑 Delete Schedule</button>

    <button onclick="deleteAllSchedules()">🗑 Delete All Schedules</button>

    <button onclick="generateDoc()">📄 Generate Word Doc</button>

    <label style="display:flex; align-items:center; gap:6px; font-size:14px;">
        🎨 Theme Color:
        <input type="color" id="themeColor" value="#002060">
    </label>

</div>

<hr>

<div class="draft-row">

    <h3>Project Information</h3>

    <div style="margin-bottom:15px;">

        <label><b>Project Name:</b></label><br>
        <input id="projectName" style="width:400px;" placeholder="Project Name">

        <select id="scheduleType" style="width:200px;">
            <option value="NDR" selected>NDR</option>
            <option value="反向路演">反向路演</option>
        </select>

        <br><br>

        <label><b>Start Date:</b></label>
        <input type="date" id="startDate" disabled>

        <label style="margin-left:20px;"><b>End Date:</b></label>
        <input type="date" id="endDate" disabled>

    </div>

    <h3>Management Team</h3>

    <table id="managementTable" cellpadding="5" cellspacing="0" style="width:90%;">

        <thead>
            <tr>
                <th>Name</th>
                <th>Title</th>
                <th></th>
            </tr>
        </thead>

        <tbody></tbody>

    </table>

    <div style="margin-top:10px;">
        <button onclick="addManagementRow()">+ Add</button>
    </div>

    <br>

    <h3>CMS Team</h3>

    <table id="cmsTable" cellpadding="5" cellspacing="0" style="width:100%;">

        <thead>
            <tr>
                <th>Name</th>
                <th>Title</th>
                <th>Email</th>
                <th>Phone</th>
                <th></th>
            </tr>
        </thead>

        <tbody></tbody>

    </table>

    <div style="margin-top:10px;">
        <button onclick="addCMSRow()">+ Add</button>
    </div>

</div>

<div id="daysContainer"></div>

<div style="text-align:center;">
    <button id="addDayBtn" onclick="addDay()">+ Add Day</button>
</div>

<hr>

<script>

const STORAGE_KEY = "savedSchedules";

// ========================================================
// TOGGLE 投资人简介 / 过往投资港股基石案例 (per meeting)
// ========================================================
function toggleMeetingIntro(btn) {
    const wrapper = btn.closest(".participant-wrapper");
    const rows = wrapper.querySelectorAll(".textarea-row");
    const isVisible = [...rows].some(r => r.classList.contains("visible"));
    rows.forEach(r => r.classList.toggle("visible", !isVisible));
    btn.textContent = isVisible ? "📋 Show 投资人简介" : "📋 Hide 投资人简介";
}

// ========================================================
// MANAGEMENT TEAM
// ========================================================
function addManagementRow(data = {}) {

    const tbody = document.querySelector("#managementTable tbody");

    const id = Date.now() + Math.floor(Math.random() * 100000);

    const tr = document.createElement("tr");

    tr.innerHTML = `
        <td style="position:relative;">

            <input
                style="width:95%;"
                value="${data.name || ""}"
                placeholder="Name"
                oninput="searchManagement(this, ${id})"
            >

            <div
                id="mgmt-search-${id}"
                class="search-results"
            ></div>

        </td>

        <td>
            <input
                style="width:95%;"
                value="${data.title || ""}"
                placeholder="Title"
            >
        </td>

        <td>
            <button onclick="this.closest('tr').remove()">🗑</button>
        </td>
    `;

    tbody.appendChild(tr);
}

// ========================================================
// CMS TEAM
// ========================================================
function addCMSRow(data = {}) {

    const tbody =
        document.querySelector("#cmsTable tbody");

    const id =
        Date.now() + Math.floor(Math.random() * 100000);

    const tr = document.createElement("tr");

    tr.innerHTML = `

        <td style="position:relative;">

            <textarea
                style="width:90%; height:25px; resize:vertical;"
                placeholder="Name"
                oninput="searchCMS(this, ${id})"
            >${data.name || ""}</textarea>

            <div
                id="cms-search-${id}"
                class="search-results"
            ></div>

        </td>

        <td>
            <textarea
                style="width:90%; height:25px; resize:vertical;"
                placeholder="Title"
            >${data.title || ""}</textarea>
        </td>

        <td>
            <input
                style="width:90%;; height:25px;"
                value="${data.email || ""}"
                placeholder="Email"
            >
        </td>

        <td>
            <textarea
                style="width:90%; height:25px; resize:vertical;"
                placeholder="Phone"
            >${data.phone || ""}</textarea>
        </td>

        <td>
            <button onclick="this.closest('tr').remove()">
                🗑
            </button>
        </td>
    `;

    tbody.appendChild(tr);
}

// ========================================================
// PHONE FORMAT HELPER
// ========================================================
function formatPhoneNumbers(phoneStr) {

    if (!phoneStr) return "";

    const parts = phoneStr.split(/(?=\(\+\d+\))/g);

    return parts
        .map(p => p.trim())
        .filter(Boolean)
        .join("\n");
}

// ========================================================
// SEARCH
// ========================================================
async function searchCMS(input, id) {

    const q = input.value.trim();
    const box = document.getElementById(`cms-search-${id}`);

    if (!q) {
        box.innerHTML = "";
        return;
    }

    // helper: render results
    function render(data) {
        box.innerHTML = "";

        data.forEach(item => {
            const row = document.createElement("div");
            row.className = "suggestion";

            row.innerText = [
                item["English Full Name"],
                item["English Name"],
                item["Chinese Full Name"],
                item["Work Title"]
            ]
            .filter(Boolean)
            .join(" | ");

            row.onclick = () => {
                const tr = input.closest("tr");

                const nameTextarea = tr.querySelectorAll("textarea")[0];
                const titleTextarea = tr.querySelectorAll("textarea")[1];
                const phoneTextarea = tr.querySelectorAll("textarea")[2];
                const emailInput = tr.querySelectorAll("input")[0];

                const englishFullName = item["English Full Name"] || "";
                const englishName = item["English Name"] || "";
                const chineseName = item["Chinese Full Name"] || "";

                nameTextarea.value =
                    [englishFullName, englishName].filter(Boolean).join(", ") +
                    (chineseName ? "\n" + chineseName : "");

                const englishTitle = item["Work Title"] || "";
                const chineseTitle = item["Chinese Title"] || "";

                titleTextarea.value =
                    englishTitle + (chineseTitle ? "\n" + chineseTitle : "");

                emailInput.value =
                    item["Email"] || item["Unnamed: 7"] || "";

                phoneTextarea.value =
                    formatPhoneNumbers(item["Phone"] || "");

                box.innerHTML = "";
            };

            box.appendChild(row);
        });
    }

    async function fetchData(query) {
        const res = await fetch(
            "/search-contact?q=" + encodeURIComponent(query)
        );
        return await res.json();
    }

    // 1st attempt: original query
    let data = await fetchData(q);

    // 2nd attempt: fallback if no result (important fix)
    if (!data || data.length === 0) {
        const fallbackQuery = q.split(/\s+/).join(" ");
        data = await fetchData(fallbackQuery);
    }

    box.innerHTML = "";

    render(data);
}
// ========================================================
// DAY
// ========================================================
function addDay(referenceNode = null, position = "end", dayData = null) {

    const day = document.createElement("div");
    day.className = "draft-row";
    day.setAttribute("data-day", "true");

    day.innerHTML = `
        <h3 class="day-title"></h3>

        📅 <input type="date">
        📍 <input placeholder="Location">

        <div class="meetings"></div>

        <div class="day-footer">
            <button onclick="addDay(this.closest('[data-day]'), 'before')">+ Day Above</button>
            <button onclick="addDay(this.closest('[data-day]'), 'after')">+ Day Below</button>
            <button onclick="deleteDay(this)">🗑 Delete Day</button>
        </div>
    `;

    const container = document.getElementById("daysContainer");

    if (position === "before" && referenceNode) {
        container.insertBefore(day, referenceNode);

    } else if (position === "after" && referenceNode) {
        container.insertBefore(day, referenceNode.nextSibling);

    } else {
        container.appendChild(day);
    }

    updateDayNumbers();
    updateAddDayButton();

    if (dayData) {

        day.querySelector('input[type="date"]').value =
            dayData.date || "";

        day.querySelector('input[placeholder="Location"]').value =
            dayData.location || "";

        if (dayData.meetings && dayData.meetings.length > 0) {

            dayData.meetings.forEach(m => {
                addMeeting(day, null, "end", m);
            });

        } else {
            addMeeting(day);
        }

    } else {
        addMeeting(day);
    }
}

function createParticipantFields(id, data = {}) {

    const div = document.createElement("div");

    div.className = "participant-set";

    div.style.cssText = "border-top:1px solid #ddd; padding-top:8px; margin-top:8px;";

    div.innerHTML = `

        <input type="hidden" id="addr-${id}" class="addr" value="${data.addr || ""}">

        <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:8px;">
            <div style="flex:1;">
                <input id="cname-${id}"
                       class="cname"
                       placeholder="机构名称（中文）"
                       value="${data.company_cn || ""}">

                <input id="ename-${id}"
                       class="ename"
                       placeholder="机构名称（英文）"
                       value="${data.company_en || ""}">

                <input id="type-${id}"
                       class="type"
                       placeholder="投资者类型"
                       value="${data.type || ""}">

                <textarea id="contact-${id}"
                       class="contact"
                       placeholder="联系人">${data.contact || ""}</textarea>

                <input id="aum-${id}"
                       class="aum"
                       placeholder="AUM"
                       value="${data.aum || ""}">

                <div class="textarea-row">
                    <textarea id="intro-${id}"
                        class="intro"
                        placeholder="投资人简介">${data.intro || ""}</textarea>

                    <textarea id="case-${id}"
                        class="case"
                        placeholder="过往投资港股基石案例">${data.case || ""}</textarea>
                </div>
            </div>
            <button type="button"
                onclick="removeParticipant(this)"
                style="flex-shrink:0; margin-top:5px;">🗑</button>
        </div>
    `;

    return div;
}



function syncParticipantSets(meetingBox) {
    // no-op: participants are managed via search + per-row delete
}



// ========================================================
// MEETING
// ========================================================
function addMeeting(dayElement, referenceNode = null, position = "end", meetingData = null) {

    const container = dayElement.querySelector(".meetings");

    const id = Date.now() + Math.floor(Math.random() * 100000);

    const div = document.createElement("div");

    div.className = "draft-row";

    div.innerHTML = `
        <div style="display:flex; gap:10px; margin-bottom:10px;">

            <input type="text"
                placeholder="HH:MM (24h)"
                style="width:120px;">

            <textarea
                placeholder="Address"
                class="meeting-address"
                style="resize:vertical; height:28px; width:300px;"></textarea>

        </div>

        <div class="participant-wrapper draft-row" style="margin:10px 0;">
            <input class="participant-search"
                   oninput="searchData(this)"
                   placeholder="Search Company"
                   style="width:300px;">
            <div class="search-results" style="width:300px;"></div>
            <div class="participant-list"></div>
            <div class="participant-buttons" style="text-align:center;margin-top:10px;">
                <button type="button" onclick="toggleMeetingIntro(this)">📋 Show 投资人简介</button>
            </div>
        </div>

        <div style="margin-top:10px;">
            <select id="meetingtype-${id}"
                onchange="syncParticipantSets(this.closest('.draft-row'))">
                <option value="">Meeting Type</option>
                <option value="1x1" selected>1x1</option>
                <option value="小组会">小组会</option>
            </select>

            <select id="mode-${id}">
                <option value="">Mode</option>
                <option value="线下会议" selected>线下会议</option>
                <option value="线上会议">线上会议</option>
                <option value="线下及线上会议">线下及线上会议</option>
                <option value="午餐会">午餐会</option>
                <option value="晚餐会">晚餐会</option>
            </select>

            <select id="language-${id}">
                <option value="">Language</option>
                <option value="中文" selected>中文</option>
                <option value="英文">英文</option>
            </select>
        </div>

        <div class="meeting-controls" style="margin-bottom:10px;">
            <button onclick="addMeeting(this.closest('[data-day]'), this.closest('.draft-row'), 'before')">
                + Meeting Before
            </button>

            <button onclick="addMeeting(this.closest('[data-day]'), this.closest('.draft-row'), 'after')">
                + Meeting After
            </button>

            <button onclick="deleteMeeting(this.closest('.draft-row'))">
                🗑 Delete Meeting
            </button>
        </div>
    `;

    if (position === "before" && referenceNode) {

        container.insertBefore(div, referenceNode);

    } else if (position === "after" && referenceNode) {

        container.insertBefore(div, referenceNode.nextSibling);

    } else {

        container.appendChild(div);
    }

    const participantList =
        div.querySelector('.participant-list');

    // ====================================================
    // LOAD EXISTING PARTICIPANTS
    // ====================================================

    if (meetingData && meetingData.participants) {

        meetingData.participants.forEach(p => {

            const pid =
                Date.now() + Math.floor(Math.random() * 100000);

            participantList.appendChild(
                createParticipantFields(pid, p)
            );
        });
    }

    // ====================================================
    // LOAD MEETING DATA
    // ====================================================

    if (meetingData) {

        div.querySelector('input[placeholder="HH:MM (24h)"]').value =
            meetingData.time || "";

        div.querySelector('.meeting-address').value =
            meetingData.address || "";

        document.getElementById(`meetingtype-${id}`).value =
            meetingData.meetingtype || "1x1";

        document.getElementById(`mode-${id}`).value =
            meetingData.mode || "线下会议";

        document.getElementById(`language-${id}`).value =
            meetingData.language || "中文";
    }
}

// ========================================================
// SEARCH
// ========================================================
async function searchData(input) {

    const q = input.value.trim();

    const box = input.nextElementSibling; // .search-results sibling

    if (!q) {
        box.innerHTML = "";
        return;
    }

    const res = await fetch("/search?q=" + encodeURIComponent(q));
    const data = await res.json();

    box.innerHTML = "";

    data.forEach(item => {

        const row = document.createElement("div");
        row.className = "suggestion";

        const cn = item["机构名称（中文）"];
        const en = item["机构名称（英文）"];

        row.innerText = [cn, en].filter(Boolean).join(" ");

        row.onclick = () => {

            const wrapper = input.closest(".participant-wrapper");
            const list = wrapper.querySelector(".participant-list");

            const pid = Date.now() + Math.floor(Math.random() * 100000);
            const newSet = createParticipantFields(pid, {
                company_cn: cn || "",
                company_en: en || "",
                type:       item["投资者类型"] || "",
                contact:    item["联系人"] || "",
                aum:        item["AUM"] || "",
                intro:      item["投资人简介"] || "",
                case:       item["过往投资港股基石案例"] || "",
                addr:       item["地址"] || "",
            });

            list.appendChild(newSet);

            updateMeetingType(wrapper);

            // keep textarea-row visibility in sync with toggle state
            const toggleBtn = wrapper.querySelector('.participant-buttons button');
            const introVisible = toggleBtn.textContent.includes("Hide");
            newSet.querySelectorAll('.textarea-row').forEach(r =>
                r.classList.toggle('visible', introVisible)
            );

            input.value = "";
            box.innerHTML = "";
        };

        box.appendChild(row);
    });
}

// ========================================================
// REMOVE PARTICIPANT
// ========================================================
function removeParticipant(btn) {

    const wrapper = btn.closest('.participant-wrapper');
    const set = btn.closest('.participant-set');

    set.remove();

    updateMeetingType(wrapper);
}

function updateMeetingType(wrapper) {

    // wrapper itself carries class draft-row, so use parentElement to reach the meeting box
    const meetingBox = wrapper.parentElement;
    const select = meetingBox.querySelector('select[id^="meetingtype-"]');
    if (!select) return;

    const participantEls = wrapper.querySelectorAll('.participant-set');
    const count = participantEls.length;

    select.value = count > 1 ? "小组会" : "1x1";

    // ====================================================
    // AUTO ADDRESS
    // 1x1 (0 or 1 participant) → fetch address from that participant
    // 小组会 (more than 1)      → always empty
    // ====================================================
    const addressInput = meetingBox.querySelector('.meeting-address');

    if (addressInput) {

        if (count === 1) {

            addressInput.value =
                participantEls[0].querySelector('.addr')?.value || "";

        } else {

            addressInput.value = "";
        }
    }
}

// ========================================================
// DELETE
// ========================================================
function deleteMeeting(el) {

    const day = el.closest('[data-day]');

    const meetings = day.querySelector('.meetings').children;

    if (meetings.length === 1) {

        if (confirm("Delete last meeting → delete whole day?")) {

            day.remove();

            updateDayNumbers();

            updateAddDayButton();
        }

    } else {

        if (confirm("Delete meeting?")) {
            el.remove();
        }
    }
}

function deleteDay(btn) {

    const day = btn.closest('[data-day]');

    if (!confirm("Delete day?")) return;

    day.remove();

    updateDayNumbers();

    updateAddDayButton();
}

function formatPhoneNumbers(phoneStr) {

    if (!phoneStr) return "";

    // split when a new country code starts like (+XX)
    const parts = phoneStr.split(/(?=\(\+\d+\))/g);

    return parts
        .map(p => p.trim())
        .filter(Boolean)
        .join("\n");
}
// ========================================================
// UTIL
// ========================================================
function updateDayNumbers() {

    document.querySelectorAll('[data-day]').forEach((d, i) => {

        d.querySelector(".day-title").innerText =
            "Day " + (i + 1);
    });
}

function updateAddDayButton() {

    const count = document.querySelectorAll('[data-day]').length;

    document.getElementById("addDayBtn").style.display =
        count === 0 ? "inline-block" : "none";
}

function formatChineseDate(dateStr) {

    if (!dateStr) return "";

    const d = new Date(dateStr);

    const weekdays = [
        "周日","周一","周二","周三","周四","周五","周六"
    ];

    return `${d.getMonth()+1}月${d.getDate()}日（${weekdays[d.getDay()]}）`;
}

// ========================================================
// COLLECT DATA
// ========================================================
function collectScheduleData() {

    // ====================================================
    // AUTO GENERATE START / END DATE
    // ====================================================
    const scheduleType =
        document.getElementById("scheduleType").value;

    let typeEN = "";
    let typeCN = "";
    let typeCN2 = "反向路演";

    if (scheduleType === "NDR") {
        typeEN = "NDR";
        typeCN = "非交易路演";
    } else if (scheduleType === "反向路演") {
        typeEN = "反向路演";
        typeCN = "反向路演";
    }
    const dayInputs = document.querySelectorAll(
        '[data-day] input[type="date"]'
    );

    let startDate = "";
    let endDate = "";

    if (dayInputs.length > 0) {

        startDate = dayInputs[0].value || "";

        endDate =
            dayInputs[dayInputs.length - 1].value || "";
    }

    // if startDate and endDate are the same, clear endDate
    if (startDate && endDate && startDate === endDate) {
        endDate = "";
    }

    // auto update the boxes
    document.getElementById("startDate").value = startDate;
    document.getElementById("endDate").value = endDate;

    const projectName =
        document.getElementById("projectName").value;

    // ====================================================
    // FORMAT DATES
    // ====================================================
    function formatWholeDate(dateStr) {

        if (!dateStr) return "";

        const d = new Date(dateStr);

        return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
    }

    function formatSimpleDate(dateStr) {

        if (!dateStr) return "";

        const d = new Date(dateStr);

        return `${d.getMonth() + 1}月${d.getDate()}日`;
    }

    // ====================================================
    // FORMAT MEETING TYPE
    // ====================================================
    function formatMeetingType(type) {

        if (!type) return "";

        return type.replace(/x/g, "对");
    }

    const managementTeam = [];

    document.querySelectorAll("#managementTable tbody tr")
    .forEach(tr => {

        const inputs = tr.querySelectorAll("input");

        managementTeam.push({
            name: inputs[0]?.value || "",
            title: inputs[1]?.value || ""
        });
    });

    const cmsTeam = [];

    document.querySelectorAll("#cmsTable tbody tr")
    .forEach(tr => {

        const textareas = tr.querySelectorAll("textarea");
        const inputs = tr.querySelectorAll("input");

        cmsTeam.push({
            name: textareas[0]?.value || "",
            title: textareas[1]?.value || "",
            phone: textareas[2]?.value || "",
            email: inputs[0]?.value || "",
        });
    });

    const days = [];

    document.querySelectorAll('[data-day]').forEach(dayEl => {

        const date =
            dayEl.querySelector('input[type="date"]').value;

        const location =
            dayEl.querySelector('input[placeholder="Location"]').value;

        const meetings = [];

        dayEl.querySelectorAll('.meetings > .draft-row')
        .forEach(m => {

            const meetingType =
                m.querySelector('select[id^="meetingtype-"]')?.value || "";

            const rawMeetingType = meetingType;

            const participantEls =
                m.querySelectorAll('.participant-set');

            const participants = [];

            // ====================================================
            // CLEAN ADDRESS LOGIC (FIXED)
            // ====================================================
            let meetingAddress = "";

            // safer DOM resolution
            const addressInput = m.querySelector('.meeting-address');

            if (addressInput) {
                meetingAddress = addressInput.value?.trim() || "";
            }

            // fallback rule (only if 1x1 and single participant)
            if (meetingType === "1x1" && participantEls.length === 1) {

                // ONLY use participant address if it exists
                const fallbackAddr =
                    participantEls[0].querySelector('.addr')?.value;

                if (fallbackAddr) {
                    meetingAddress = fallbackAddr;
                }
            }

            participantEls.forEach(p => {

                participants.push({

                company_cn:
                    p.querySelector('.cname')?.value || "",

                company_en:
                    p.querySelector('.ename')?.value || "",

                // ====================================================
                // NEW FIELD: formatted_companyName
                // ====================================================
                formatted_companyName: (() => {

                    const cn = p.querySelector('.cname')?.value?.trim() || "";
                    const en = p.querySelector('.ename')?.value?.trim() || "";

                    if (!cn && !en) return "";

                    if (!cn) return en;

                    if (!en) return cn;

                    return `${en}\n${cn}`;

                })(),

                type:
                    p.querySelector('.type')?.value || "",

                contact:
                    p.querySelector('.contact')?.value || "",

                aum:
                    p.querySelector('.aum')?.value || "",

                intro:
                    p.querySelector('.intro')?.value || "",

                case:
                    p.querySelector('.case')?.value || ""
            });
            });

            meetings.push({

                time:
                    m.querySelector('input[placeholder="HH:MM (24h)"]')?.value || "",

                meetingtype:
                    meetingType,

                formatted_meetingtype:
                    formatMeetingType(rawMeetingType),

                mode:
                    m.querySelector('select[id^="mode-"]')?.value || "",

                language:
                    m.querySelector('select[id^="language-"]')?.value || "",

                location:
                    m.querySelector('.meeting-location')?.value || "",

                address: meetingAddress,

                participants,

                participantCount: participantEls.length || 1
            });
        });

        days.push({
            date,
            formatted_date: formatChineseDate(date),
            location,
            meetings
        });
    });

    // ====================================================
    // FORMAT LOCATIONS
    // ====================================================
    const uniqueLocations = [...new Set(

        days
            .map(d => (d.location || "").trim())
            .filter(l => l !== "")

    )];

    const formatted_location =
        uniqueLocations.join("、");
    
    // ====================================================
    // NEW FLATTENED PARTICIPANT TABLE
    // ====================================================
    const participantTable = [];

    days.forEach(day => {

        day.meetings.forEach(meeting => {

            meeting.participants.forEach((p, index) => {

                participantTable.push({

                    formatted_companyName:
                        p.formatted_companyName || "",

                    time:
                        index === 0
                            ? meeting.time || ""
                            : "",

                    meetingtype:
                        index === 0
                            ? meeting.formatted_meetingtype || meeting.meetingtype || ""
                            : "",

                    language:
                        index === 0
                            ? meeting.language || ""
                            : "",

                    type:
                        p.type || "",

                    aum:
                        p.aum || "",

                    contact:
                        p.contact || "",

                    intro:
                        p.intro || "",

                    case:
                        p.case || ""
                });
            });
        });
    });

    return {
        projectName,
        typeEN,
        typeCN,
        typeCN2,

        startDate,
        endDate,

        formatted_startDate:
            formatWholeDate(startDate),

        formatted_endDate:
            formatSimpleDate(endDate),

        period: endDate
            ? formatWholeDate(startDate) + "至" + formatSimpleDate(endDate)
            : formatWholeDate(startDate),

        formatted_location,

        managementTeam,
        cmsTeam,
        days,
        participantTable
    };
}
// ========================================================
// SAVE
// ========================================================
function saveSchedule() {

    const projectName =
        document.getElementById("projectName").value.trim();

    const scheduleType =
        document.getElementById("scheduleType").value;

    if (!projectName) {
        alert("Enter project name");
        return;
    }

    const autoName =
        `Project ${projectName}-${scheduleType}会议日程安排和投资者简介`;

    // auto-fill the display name field (optional but useful)
    document.getElementById("scheduleName").value = autoName;

    const schedules =
        JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");

    schedules[autoName] = collectScheduleData();

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(schedules)
    );

    refreshScheduleList();
}
// ========================================================
// LOAD
// ========================================================
function loadScheduleFromSelect() {

    const select =
        document.getElementById("scheduleList");

    const name = select.value;

    if (!name) return;

    const schedules =
        JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");

    const data = schedules[name];

    if (!data) return;

    document.getElementById("scheduleName").value = name;

    document.getElementById("projectName").value =
        data.projectName || "";

    document.getElementById("startDate").value =
        data.startDate || "";

    document.getElementById("endDate").value =
        data.endDate || "";

    document.getElementById("daysContainer").innerHTML = "";

    document.querySelector("#managementTable tbody").innerHTML = "";

    document.querySelector("#cmsTable tbody").innerHTML = "";

    if (data.managementTeam) {
        data.managementTeam.forEach(row => {
            addManagementRow(row);
        });
    }

    if (data.cmsTeam) {
        data.cmsTeam.forEach(row => {
            addCMSRow(row);
        });
    }

    if (data.days) {
        data.days.forEach(dayData => {
            addDay(null, "end", dayData);
        });
    }

    updateDayNumbers();
    updateAddDayButton();
}

// ========================================================
// DELETE SCHEDULE
// ========================================================
function deleteSchedule() {

    const name =
        document.getElementById("scheduleList").value;

    if (!name) {
        alert("Select a saved schedule");
        return;
    }

    if (!confirm(`Delete "${name}"?`)) return;

    const schedules =
        JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");

    delete schedules[name];

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(schedules)
    );

    refreshScheduleList();

    alert("Deleted");
}

// ========================================================
// DELETE ALL SCHEDULES
// ========================================================
function deleteAllSchedules() {

    const schedules =
        JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");

    const count = Object.keys(schedules).length;

    if (count === 0) {
        alert("No saved schedules to delete.");
        return;
    }

    if (!confirm(`Are you sure you want to delete all ${count} saved schedule(s)?\n\nThis cannot be undone.`)) return;

    if (!confirm(`Second confirmation: permanently delete ALL ${count} schedule(s)?`)) return;

    localStorage.removeItem(STORAGE_KEY);

    refreshScheduleList();

    alert("All schedules deleted.");
}

// ========================================================
// NEW SCHEDULE
// ========================================================
function newSchedule() {

    if (!confirm("Start new schedule?")) return;

    document.getElementById("scheduleName").value = "";

    document.getElementById("projectName").value = "";

    document.getElementById("startDate").value = "";

    document.getElementById("endDate").value = "";

    document.querySelector("#managementTable tbody").innerHTML = "";

    document.querySelector("#cmsTable tbody").innerHTML = "";

    document.getElementById("daysContainer").innerHTML = "";

    addManagementRow();

    addCMSRow();

    addDay();

    updateAddDayButton();
}

// ========================================================
// REFRESH DROPDOWN
// ========================================================
function refreshScheduleList() {

    const schedules =
        JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");

    const select =
        document.getElementById("scheduleList");

    select.innerHTML =
        `<option value="">Saved Schedules</option>`;

    Object.keys(schedules).forEach(name => {

        const opt = document.createElement("option");

        opt.value = name;

        opt.innerText = name;

        select.appendChild(opt);
    });
}

// ========================================================
// EXPORT
// ========================================================
async function generateDoc() {

    const scheduleData = collectScheduleData();

    // ====================================================
    // DEBUG OUTPUT
    // ====================================================
    console.log("FULL EXPORT DATA:");
    console.log(scheduleData);

    console.log("PROJECT INFO:");
    console.table([{
        projectName: scheduleData.projectName,
        startDate: scheduleData.startDate,
        endDate: scheduleData.endDate
    }]);

    console.log("MANAGEMENT TEAM:");
    console.table(scheduleData.managementTeam);

    console.log("CMS TEAM:");
    console.table(scheduleData.cmsTeam);

    scheduleData.days.forEach((day, dayIndex) => {

        console.log(`DAY ${dayIndex + 1}:`);

        console.table([{
            date: day.date,
            formatted_date: day.formatted_date,
            location: day.location
        }]);

        console.log(`DAY ${dayIndex + 1} MEETINGS:`);

        day.meetings.forEach((meeting, meetingIndex) => {

            console.log(`Meeting ${meetingIndex + 1}`);

            console.table([{
                time: meeting.time,
                address: meeting.address,
                meetingtype: meeting.meetingtype,
                mode: meeting.mode,
                language: meeting.language,
                participantCount: meeting.participants.length
            }]);

            console.log("Participants:");

            console.table(meeting.participants);
        });
    });

    // ====================================================
    // VALIDATION
    // ====================================================
    if (scheduleData.days.length === 0) {

        alert("No data to export");

        return;
    }

    // ====================================================
    // SEND TO BACKEND
    // ====================================================
    const themeColor =
        document.getElementById("themeColor").value.replace("#", "").toUpperCase();

    const res = await fetch("/generate-doc", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({ ...scheduleData, themeColor })
    });

    if (!res.ok) {

        const text = await res.text();

        console.error("SERVER ERROR:");
        console.error(text);

        alert("Generate failed");

        console.log("FINAL JSON SENT:", JSON.stringify(scheduleData, null, 2));

        return;
    }

    const blob = await res.blob();

    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");

    a.href = url;

    const projectName =
    scheduleData.projectName || "Project";

    const scheduleType =
        document.getElementById("scheduleType")?.value || "NDR";

    const filename =
        `Project ${projectName}-${scheduleType}会议日程安排和投资者简介.docx`;

    a.download = filename;

    a.click();

    URL.revokeObjectURL(url);
}

// INIT
// ========================================================
window.onload = function () {

    refreshScheduleList();

    addManagementRow();

    addCMSRow();

    addDay();

    updateAddDayButton();
    
};
