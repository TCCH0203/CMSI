<!DOCTYPE html>
<html>
<head>
    <title>Schedule View</title>
    <style>
        body {
            font-family: Arial;
            margin: 30px;
        }

        .card {
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            background: #fafafa;
        }

        .nav {
            margin-bottom: 20px;
        }

        .title {
            font-weight: bold;
            font-size: 18px;
        }

        .sub {
            color: #555;
        }

    </style>
</head>

<body>

<h2>📊 Schedule View</h2>

<div class="nav">
    <a href="/">Home</a> |
    <a href="/schedule">Schedule</a> |
    <a href="/generate">Generate Word</a>
</div>

{% for m in meetings %}
<div class="card">
    <div class="title">{{ m.meetingtype }} - {{ m.companyname }}</div>
    <div class="sub">Type: {{ m.companytype }}</div>
    <div class="sub">Participant: {{ m.participant }}</div>
    <div class="sub">Address: {{ m.address }}</div>
</div>
{% endfor %}

</body>
</html>
